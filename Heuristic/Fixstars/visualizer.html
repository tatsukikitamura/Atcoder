<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixstars Clique Visualizer</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --primary: #38bdf8;
            --success: #22c55e;
            --danger: #ef4444;
            --border: #334155;
            --highlight: rgba(56, 189, 248, 0.2);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 0.75rem 2rem;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        header h1 {
            margin: 0;
            font-size: 1.1rem;
            color: var(--primary);
            font-weight: 700;
        }

        .upload-zone {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .drop-area {
            border: 2px dashed var(--border);
            border-radius: 0.5rem;
            padding: 0.5rem 1.5rem;
            font-size: 0.8rem;
            color: #94a3b8;
            transition: all 0.2s;
            cursor: pointer;
            background: rgba(15, 23, 42, 0.5);
        }

        .drop-area.dragover {
            border-color: var(--primary);
            background: var(--highlight);
            color: var(--text-color);
        }

        .main-content {
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            grid-template-rows: 1fr;
            gap: 1rem;
            padding: 1rem;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow: hidden;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .card h2 {
            margin: 0 0 0.75rem 0;
            font-size: 0.9rem;
            color: var(--primary);
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .case-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .case-item {
            padding: 0.5rem 0.75rem;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .case-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .case-item.active {
            background: var(--primary);
            color: #0f172a;
            font-weight: 600;
        }

        .case-status {
            font-size: 0.65rem;
            opacity: 0.8;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.7rem;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 0.9rem;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }

        .status-badge {
            display: inline-block;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: 700;
        }

        .status-satisfied {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }

        .status-violated {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        .param-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            padding-right: 0.5rem;
        }

        .param-item {
            display: grid;
            grid-template-columns: 30px 1fr 50px;
            gap: 0.4rem;
            align-items: center;
            font-size: 0.7rem;
        }

        .param-id {
            color: #64748b;
            font-family: monospace;
        }

        .param-val {
            text-align: right;
            font-family: monospace;
        }

        .progress-bg {
            background: #0f172a;
            height: 4px;
            border-radius: 2px;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.3s;
        }

        .target-marker {
            position: absolute;
            top: 0;
            width: 1.5px;
            height: 100%;
            background: white;
            z-index: 1;
        }

        .visualizer-pane {
            position: relative;
            background: #020617;
            border-radius: 0.75rem;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        #graph-canvas {
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        .graph-legend {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(4px);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 0.75rem;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            z-index: 5;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.7rem;
            color: #94a3b8;
        }

        .legend-color {
            width: 10px;
            height: 10px;
            border-radius: 5px;
        }

        .controls {
            position: absolute;
            bottom: 1rem;
            right: 1rem;
            display: flex;
            gap: 0.4rem;
        }

        .control-btn {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border);
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
            font-size: 0.8rem;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 2px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Fixstars Visualizer</h1>
        <div class="upload-zone">
            <div id="drop-area" class="drop-area">
                Drag & Drop all .in/.out data here
                <input type="file" id="file-input" hidden multiple accept=".in,.out,.txt">
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="sidebar">
            <div class="card" style="flex: 1;">
                <h2>Test Cases <span id="case-count" style="font-size: 0.7rem; color: #64748b;"></span></h2>
                <div id="case-list" class="case-list">
                    <!-- Cases list -->
                </div>
            </div>
        </div>

        <div class="visualizer-pane">
            <div class="graph-legend">
                <div class="legend-item">
                    <div class="legend-color" style="background: #38bdf8; box-shadow: 0 0 5px #38bdf8;"></div>
                    <span>Party Member (Selected)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #475569;"></div>
                    <span>Other Adventurer</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #38bdf8; height: 2px; border-radius: 0;"></div>
                    <span>Compatibility (In Party)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: rgba(51, 65, 85, 0.2); height: 2px; border-radius: 0;">
                    </div>
                    <span>Compatibility (General)</span>
                </div>
            </div>
            <canvas id="graph-canvas"></canvas>
            <div class="controls">
                <button class="control-btn" onclick="resetView()">⟲</button>
                <button class="control-btn" onclick="zoom(1.2)">+</button>
                <button class="control-btn" onclick="zoom(0.8)">−</button>
            </div>
        </div>

        <div class="sidebar">
            <div class="card">
                <h2>
                    Summary
                    <span id="status-badge" class="status-badge" style="display:none;"></span>
                </h2>
                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-label">Total Weight</span>
                        <span id="stat-weight" class="stat-value">-</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Party Size</span>
                        <span id="stat-size" class="stat-value">-</span>
                    </div>
                </div>
            </div>

            <div class="card" style="flex: 1;">
                <h2>Constraints</h2>
                <div id="param-list" class="param-list">
                    <!-- Parameters -->
                </div>
            </div>
        </div>
    </main>

    <div id="loading" class="loading-overlay">
        <div style="color: var(--primary); font-weight: bold;">Processing files...</div>
    </div>

    <script>
        const caseStore = new Map(); // caseId -> { input: string, output: string }
        let activeCaseId = null;
        let inputData = null;
        let outputData = null;

        const fileInput = document.getElementById('file-input');
        const dropArea = document.getElementById('drop-area');
        const caseListEl = document.getElementById('case-list');
        const canvas = document.getElementById('graph-canvas');
        const ctx = canvas.getContext('2d');

        let nodes = [];
        let edges = [];
        let scale = 1;
        let translateX = 0;
        let translateY = 0;
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;

        // --- File Handling ---

        dropArea.onclick = () => fileInput.click();
        dropArea.ondragover = (e) => { e.preventDefault(); dropArea.classList.add('dragover'); };
        dropArea.ondragleave = () => dropArea.classList.remove('dragover');
        dropArea.ondrop = (e) => { e.preventDefault(); dropArea.classList.remove('dragover'); handleFiles(e.dataTransfer.files); };
        fileInput.onchange = (e) => handleFiles(e.target.files);

        async function handleFiles(files) {
            document.getElementById('loading').style.display = 'flex';

            for (const file of files) {
                const text = await file.text();
                const caseId = getCaseId(file.name);
                if (!caseId) continue;

                if (!caseStore.has(caseId)) caseStore.set(caseId, { input: null, output: null });
                const entry = caseStore.get(caseId);

                if (isInputFile(text, file.name)) entry.input = text;
                else if (isOutputFile(text, file.name)) entry.output = text;
            }

            updateCaseList();
            document.getElementById('loading').style.display = 'none';

            if (!activeCaseId && caseStore.size > 0) {
                const firstId = caseStore.keys().next().value;
                selectCase(firstId);
            }
        }

        function getCaseId(name) {
            // Match patterns: in-small-1.txt, out-small-1.txt, golden-small-1.txt, small-1.in, small-1.out
            let id = name.replace(/\.(txt|in|out)$/, '');
            id = id.replace(/^(in|out|golden)-/, '');
            return id;
        }

        function isInputFile(text, name) {
            if (name.includes('in-') || name.endsWith('.in')) return true;
            const lines = text.trim().split('\n');
            return lines.length > 0 && /^\d+$/.test(lines[0].trim());
        }

        function isOutputFile(text, name) {
            if (name.includes('out-') || name.includes('golden') || name.endsWith('.out')) return true;
            return text.includes('PartyMembers') || text.includes('ParameterSum');
        }

        function updateCaseList() {
            const sortedIds = Array.from(caseStore.keys()).sort((a, b) => {
                const aType = a.split('-')[0];
                const bType = b.split('-')[0];
                if (aType !== bType) return aType === 'small' ? -1 : 1;
                return parseInt(a.split('-')[1]) - parseInt(b.split('-')[1]);
            });

            document.getElementById('case-count').textContent = `(${sortedIds.length})`;

            caseListEl.innerHTML = '';
            sortedIds.forEach(id => {
                const entry = caseStore.get(id);
                const item = document.createElement('div');
                item.className = 'case-item' + (id === activeCaseId ? ' active' : '');

                let status = '';
                if (entry.input && entry.output) status = '✓ Full';
                else if (entry.input) status = '• In';
                else if (entry.output) status = '• Out';

                item.innerHTML = `
                <span>${id}</span>
                <span class="case-status">${status}</span>
            `;
                item.onclick = () => selectCase(id);
                caseListEl.appendChild(item);
            });
        }

        function selectCase(id) {
            activeCaseId = id;
            const entry = caseStore.get(id);

            inputData = null;
            outputData = null;

            if (entry.input) parseInput(entry.input);
            if (entry.output) parseOutput(entry.output);

            updateCaseList();
            render();
        }

        // --- Parsing ---

        function parseInput(text) {
            const lines = text.trim().split(/\s+/);
            let ptr = 0;
            const N = parseInt(lines[ptr++]);
            const adj = [];
            for (let i = 0; i < N; i++) {
                adj[i] = [];
                for (let j = 0; j < N; j++) adj[i][j] = parseInt(lines[ptr++]);
            }
            const v = [];
            for (let i = 0; i < N; i++) {
                v[i] = [];
                for (let k = 0; k < 128; k++) v[i][k] = parseInt(lines[ptr++]);
            }
            const r = [];
            for (let k = 0; k < 128; k++) r[k] = parseInt(lines[ptr++]);

            inputData = { N, adj, v, r };
            initLayout();
        }

        function parseOutput(text) {
            const membersMatch = text.match(/PartyMembers\s*=\s*\{([\s\S]*?)\}/);
            if (!membersMatch) return;
            const members = membersMatch[1].trim().split(/\s+/).filter(x => x.length > 0).map(x => parseInt(x));
            const TMatch = text.match(/ParameterSum\s*=\s*(\d+)/);
            const KMatch = text.match(/PartySize\s*=\s*(\d+)/);
            outputData = {
                members,
                T: TMatch ? parseInt(TMatch[1]) : 0,
                K: KMatch ? parseInt(KMatch[1]) : members.length
            };
        }

        // --- Graph ---

        function initLayout() {
            if (!inputData) return;
            const N = inputData.N;
            nodes = [];
            const radius = Math.min(canvas.width, canvas.height) * 0.35;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            for (let i = 0; i < N; i++) {
                nodes.push({
                    x: centerX + radius * Math.cos(2 * Math.PI * i / N),
                    y: centerY + radius * Math.sin(2 * Math.PI * i / N),
                    id: i + 1
                });
            }
            edges = [];
            for (let i = 0; i < N; i++) {
                for (let j = i + 1; j < N; j++) if (inputData.adj[i][j]) edges.push([i, j]);
            }
            resetView();
        }

        function resetView() { scale = 1; translateX = 0; translateY = 0; render(); }
        function zoom(factor) { scale *= factor; render(); }

        function render() {
            if (!inputData) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                return;
            }

            const dpr = window.devicePixelRatio || 1;
            if (canvas.width !== canvas.clientWidth * dpr || canvas.height !== canvas.clientHeight * dpr) {
                canvas.width = canvas.clientWidth * dpr; canvas.height = canvas.clientHeight * dpr;
                ctx.scale(dpr, dpr);
            }

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.translate(canvas.clientWidth / 2 + translateX, canvas.clientHeight / 2 + translateY);
            ctx.scale(scale, scale);
            ctx.translate(-canvas.clientWidth / 2, -canvas.clientHeight / 2);

            const selected = new Set(outputData ? outputData.members : []);

            ctx.lineWidth = 1 / scale;
            edges.forEach(([i, j]) => {
                const inClique = selected.has(i + 1) && selected.has(j + 1);
                ctx.strokeStyle = inClique ? "rgba(56, 189, 248, 0.5)" : "rgba(51, 65, 85, 0.2)";
                if (inClique) ctx.lineWidth = 2 / scale;
                ctx.beginPath(); ctx.moveTo(nodes[i].x, nodes[i].y); ctx.lineTo(nodes[j].x, nodes[j].y); ctx.stroke();
                if (inClique) ctx.lineWidth = 1 / scale;
            });

            nodes.forEach((node) => {
                const isSelected = selected.has(node.id);
                ctx.beginPath(); ctx.arc(node.x, node.y, (isSelected ? 6 : 4) / Math.sqrt(scale), 0, 2 * Math.PI);
                ctx.fillStyle = isSelected ? "#38bdf8" : "#475569";
                if (isSelected) { ctx.shadowBlur = 8; ctx.shadowColor = "#38bdf8"; }
                ctx.fill(); ctx.shadowBlur = 0;
                if (scale > 2) {
                    ctx.fillStyle = "white"; ctx.font = `${10 / scale}px Inter`; ctx.textAlign = "center";
                    ctx.fillText(node.id, node.x, node.y - 12 / scale);
                }
            });

            updateUI();
        }

        function updateUI() {
            const sw = document.getElementById('stat-weight');
            const ss = document.getElementById('stat-size');
            const badge = document.getElementById('status-badge');
            const paramList = document.getElementById('param-list');

            if (outputData) { sw.textContent = outputData.T.toLocaleString(); ss.textContent = outputData.K; }
            else { sw.textContent = '-'; ss.textContent = '-'; }

            const currentSums = new Array(128).fill(0);
            if (outputData && inputData) {
                outputData.members.forEach(m => {
                    const idx = m - 1;
                    for (let k = 0; k < 128; k++) currentSums[k] += inputData.v[idx][k];
                });
            }

            if (inputData) {
                let allSatisfied = true;
                let html = '';
                for (let k = 0; k < 128; k++) {
                    const cur = currentSums[k];
                    const req = inputData.r[k];
                    const sat = cur >= req;
                    if (!sat) allSatisfied = false;
                    const max = Math.max(cur, req, 1);
                    html += `
                    <div class="param-item" title="Dim ${k}: ${cur} / ${req}">
                        <div class="param-id">${k}</div>
                        <div class="progress-bg">
                            <div class="progress-fill" style="width: ${(cur / max) * 100}%; background: ${sat ? 'var(--success)' : 'var(--danger)'}"></div>
                            <div class="target-marker" style="left: ${(req / max) * 100}%"></div>
                        </div>
                        <div class="param-val" style="color: ${sat ? '#4ade80' : '#f87171'}">${cur}</div>
                    </div>
                `;
                }
                paramList.innerHTML = html;
                if (outputData) {
                    badge.style.display = 'inline-block'; badge.textContent = allSatisfied ? 'FEASIBLE' : 'VIOLATED';
                    badge.className = 'status-badge ' + (allSatisfied ? 'status-satisfied' : 'status-violated');
                } else badge.style.display = 'none';
            } else { paramList.innerHTML = ''; badge.style.display = 'none'; }
        }

        // --- Input ---
        canvas.onmousedown = (e) => { isDragging = true; lastMouseX = e.clientX; lastMouseY = e.clientY; };
        window.onmousemove = (e) => {
            if (!isDragging) return;
            translateX += e.clientX - lastMouseX; translateY += e.clientY - lastMouseY;
            lastMouseX = e.clientX; lastMouseY = e.clientY; render();
        };
        window.onmouseup = () => isDragging = false;
        canvas.onwheel = (e) => { e.preventDefault(); zoom(e.deltaY > 0 ? 0.9 : 1.1); };
        window.onresize = render;
        render();
    </script>

</body>

</html>
